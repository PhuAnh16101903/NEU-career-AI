<svg xmlns="http://www.w3.org/2000/svg" class="sliding-surface" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="form-alpine-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a31118" /><stop offset="1" stop-color="#750812" /></linearGradient>

        <pattern id="form-noel-texture" x="560" y="0" width="1120" height="800" patternUnits="userSpaceOnUse" viewBox="0 0 2140 1500" preserveAspectRatio="none">
          <rect width="2140" height="1500" fill="url(#form-alpine-blue)" />
          <image width="1070" height="1500" href="christmas-red-snowflake-texture-v1.jpg" />
          <image width="1070" height="1500" href="christmas-red-snowflake-texture-v1.jpg" transform="translate(2140 0) scale(-1 1)" />
          <rect width="2140" height="1500" fill="var(--form-texture-wash)" />
        </pattern>
        <mask id="sliding-surface-mask" maskUnits="userSpaceOnUse"><rect width="100%" height="100%" fill="white" /><path id="moving-window-hole" fill="black" d="M88 38H592V542H88Z" /></mask>
      </defs>

      <rect id="form-noel-surface" x="50%" width="50%" height="100%" fill="url(#form-noel-texture)" />
    <script type="application/ecmascript"><![CDATA[
(() => {
  'use strict';
  const token = new URL(location.href).searchParams.get('svg-asset');
  if (!token || parent === window) return;
  const root = document.documentElement.cloneNode(true);
  root.querySelectorAll('script').forEach(script => script.remove());
  parent.postMessage({ type: 'svg-asset', token, url: location.href,
    source: new XMLSerializer().serializeToString(root) }, '*');
})();
]]></script></svg>
